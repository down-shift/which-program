# One local inference server is reused; each agent run gets a fresh workspace.
tasks: [normalize_code]
conditions: [clean, installed, alternate]
treatments: [ordinary, provenance, instruction]
guard: false
seed: 17
budgets:
  max_steps: 16
  timeout_seconds: 60
  run_timeout_seconds: 900
  max_tokens: 24000
  max_cost: null
model:
  adapter: program_identity.agents.local_chat:LocalChatAgent
  protocol_version: local-json-v2
  name: Qwen/Qwen3-4B
  checkpoint: Qwen/Qwen3-4B
  revision: main
  dtype: bfloat16
  quantization: null
  context_length: 8192
  enable_thinking: false
  temperature: 0.2
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  max_output_tokens: 768
  request_timeout_seconds: 120
server:
  package: vllm==0.29.0
  python: '3.12'
  environment: .venv-model
  port: 8000
  gpu_memory_utilization: 0.85
  startup_timeout_seconds: 1200
runs_dir: runs/local-qwen
